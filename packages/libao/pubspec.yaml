name: tekartik_libao
description: A Dart wrapper for the libao library to output audio using a simple API on a wide variety of platforms.
version: 0.2.1
homepage: https://github.com/tiagohm/libao

environment:
  sdk: ^3.12.0

dependencies:
  ffi: ">=2.1.4"

dev_dependencies:
  test: ">=1.31.0"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
