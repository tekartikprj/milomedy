name: tekartik_midi_synth
description: >-
  MIDI synths, pure Dart: the MidiSynth interface (channel messages in,
  stereo frames out) and instruments written in Dart that need no asset:
  the reeds of an accordion, a metronome click.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dev_dependencies:
  build_runner: ">=2.15.0"
  build_web_compilers: ">=4.7.0"
  lints: ">=6.1.0"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
  test: ">=1.31.0"
