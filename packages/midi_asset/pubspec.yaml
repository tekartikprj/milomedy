name: milomedy_midi_asset
description: >-
  MIDI files made in Dart, free to use (MIT): about twenty songs in various
  styles, band songs (drums, bass, organ, guitars, brass...) and piano
  pieces, as files (lib/midi/) and as code, with the arranger that writes
  them.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  tekartik_midi:
    git:
      url: https://github.com/tekartik/midi.dart

dev_dependencies:
  build_runner: ">=2.15.0"
  build_web_compilers: ">=4.7.0"
  lints: ">=6.1.0"
  milomedy_midi_engine:
    git:
      url: https://github.com/tekartikprj/milomedy
      path: packages/midi_engine
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
  test: ">=1.31.0"

dependency_overrides:
  milomedy_midi_engine:
    path: ../midi_engine
  milomedy_midi_synth:
    path: ../midi_synth
