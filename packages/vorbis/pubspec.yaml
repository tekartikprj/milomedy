name: milomedy_vorbis
description: >-
  Ogg Vorbis decoding, pure Dart (io and the web: VM, dart2js, dart2wasm):
  the samples of an SF3 SoundFont. vorbis_decoder 0.0.1-dev.1 (MIT, a port
  of NVorbis) vendored, made exact on dart2js.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dev_dependencies:
  build_runner: ">=2.15.0"
  build_web_compilers: ">=4.7.0"
  http: ">=1.5.0"
  lints: ">=6.1.0"
  path: ">=1.9.0"
  process_run: ">=1.2.0"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
  test: ">=1.31.0"
