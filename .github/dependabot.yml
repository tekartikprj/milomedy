# Dependabot configuration file.
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2

enable-beta-ecosystems: true

updates:
  - package-ecosystem: "pub"
    directory: "packages/libao"
    schedule:
      interval: "monthly"
  - package-ecosystem: "pub"
    directory: "packages/port_audio"
    schedule:
      interval: "monthly"
  - package-ecosystem: "pub"
    directory: "packages/raw_audio"
    schedule:
      interval: "monthly"
  - package-ecosystem: "pub"
    directory: "packages/raw_audio_pcm_sound"
    schedule:
      interval: "monthly"
  - package-ecosystem: "pub"
    directory: "packages/raw_audio_wav"
    schedule:
      interval: "monthly"
  - package-ecosystem: "pub"
    directory: "packages/raw_audio_web"
    schedule:
      interval: "monthly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
